<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raspberry Pi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- Left: time, weather, + small photo -->
      <div class="left-col">
        <div class="info-panel">
          <div class="time-section">
            <div id="time"></div>
            <div id="date"></div>
          </div>

          <div class="weather-section">
            <div class="stat-card">
              <span class="stat-icon"></span>
              <span class="stat-value" id="temp"></span>
              <span class="stat-label">Temperature</span>
            </div>
            <div class="stat-card">
              <span class="stat-icon"></span>
              <span class="stat-value" id="wind"></span>
              <span class="stat-label">Wind Speed</span>
            </div>
          </div>
        </div>

        <!-- Photo: small, bottom corner -->
        <div class="photo-panel">
          <img id="img" src="./photos/img.JPG" alt="Camera Feed" />
        </div>
      </div>

      <!-- Right: Google Calendar (half screen) -->
      <div class="calendar-panel">
        <div class="cal-embed">
          <iframe
            src="https://calendar.google.com/calendar/embed?src=noah%40ultimumgroup.com&src=ericksonnoah5%40gmail.com&src=katiekanaan%40gmail.com&ctz=America%2FChicago&mode=MONTH&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0"
            frameborder="0"
            scrolling="no"
          ></iframe>
        </div>
        <div class="cal-embed">
          <iframe
            src="https://calendar.google.com/calendar/embed?src=noah%40ultimumgroup.com&src=ericksonnoah5%40gmail.com&src=katiekanaan%40gmail.com&ctz=America%2FChicago&mode=AGENDA&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0"
            frameborder="0"
            scrolling="no"
          ></iframe>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
